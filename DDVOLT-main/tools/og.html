<!DOCTYPE html>
<!-- Szablon grafiki udostępniania (assets/og.png, 1200×630).
     Otwórz w przeglądarce w oknie 1200×630 i zrób zrzut ekranu, jeśli chcesz zmienić hasło. -->
<html lang="pl">
<meta charset="utf-8">
<style>
@font-face { font-family: "Sofia Sans"; src: url(../assets/fonts/sofia-sans-latin-ext.woff2) format("woff2"); font-weight: 1 1000; unicode-range: U+0100-02BA, U+1E00-1E9F; }
@font-face { font-family: "Sofia Sans"; src: url(../assets/fonts/sofia-sans-latin.woff2) format("woff2"); font-weight: 1 1000; unicode-range: U+0000-00FF, U+2000-206F; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; }
body { position: relative; overflow: hidden; background: #000; color: #f5f5f7; font-family: "Sofia Sans", sans-serif; -webkit-font-smoothing: antialiased; }
.glow { position: absolute; left: 50%; bottom: -260px; width: 1500px; height: 760px; transform: translateX(-50%); background: radial-gradient(50% 50% at 50% 50%, rgba(242, 85, 0, .34), rgba(242, 85, 0, .08) 55%, transparent 72%); }
.brand { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
.brand i { width: 16px; height: 16px; border-radius: 5px; background: #f25500; }
h1 { position: absolute; left: 72px; top: 150px; width: 900px; font-size: 92px; line-height: .98; letter-spacing: -.026em; font-weight: 700; }
p { position: absolute; left: 72px; bottom: 60px; font-size: 26px; font-weight: 600; color: #a1a1a6; }
p b { color: #f5f5f7; font-weight: 600; }
svg { position: absolute; left: 0; bottom: 96px; width: 1200px; height: 220px; }
path { fill: none; stroke-linecap: round; }
</style>
<body>
<div class="glow"></div>
<div class="brand"><i></i>DD Volt</div>
<h1>Linie produkcyjne podłączone od&nbsp;A do&nbsp;Z.</h1>
<svg viewBox="0 0 1200 220" id="w"></svg>
<p><b>ddvolt.com</b> &nbsp;·&nbsp; elektryka i mechanika linii produkcyjnych</p>
<script>
var s = document.getElementById('w'), NS = 'http://www.w3.org/2000/svg';
function wave(phase, color, width, opacity) {
  var d = '';
  for (var x = -10; x <= 1210; x += 6) d += (d ? 'L' : 'M') + x + ' ' + (110 + Math.sin(x / 1200 * Math.PI * 4.2 + phase) * 78).toFixed(1);
  var p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d); p.setAttribute('stroke', color); p.setAttribute('stroke-width', width); p.setAttribute('opacity', opacity);
  s.appendChild(p);
}
wave(4.19, '#6e6e73', 2.5, 1); wave(2.09, '#f5f5f7', 2.5, .9);
wave(0, '#f25500', 22, .1); wave(0, '#f25500', 10, .22); wave(0, '#f25500', 4, 1);
</script>
</body>
</html>
